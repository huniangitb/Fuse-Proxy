# FTP 服务器配置：每个 [段名] 定义一个服务器
# 生效方式：在 injector.conf 写 `FTP <虚拟前缀> <段名>`（如 `FTP /云盘 云盘`），
# 虚拟前缀不含 user_id，访问时框架剥离 /<user_id>/ 后匹配（如经 /0/云盘/... 访问）
# 键名：host / port / user / password（可简写 pass）/ remote_dir
# 启用示例：
# [云盘]
# host = 192.168.1.100
# port = 21
# user = myuser
# password = mypass
# remote_dir = /
#
# 匿名服务器示例（省略 user/password）：
# [公共盘]
# host = ftp.example.com
# port = 21
# remote_dir = /public
