# FTP 服务器配置：每个 [段名] 定义一个服务器
#
# 落点：<CONFIG_DIR>/modules/ftp_module/ftp_module.conf
#   —— 这是**框架读取并下发给模块**的路径（模块不读文件、不跑 inotify，
#      见 docs/modules.md §6.1.1）。写到别处（如旧版的 <CONFIG_DIR>/ftp.conf）
#      不生效：模块会 loud 报「未收到本模块的配置（<确切路径>）」。
#   —— 也可由 rule_server 的 FTP_ADD / FTP_SET / FTP_REMOVE 命令代为落盘。
#
# 生效方式：在 injector.conf 写 `FTP <虚拟前缀> <段名>`（如 `FTP /云盘 云盘`），
# 虚拟前缀不含 user_id，访问时框架剥离 /<user_id>/ 后匹配（如经 /0/云盘/... 访问）
# 键名（权威声明见同目录 ftp_module.rules 的 [conf] 段）：
#   host / port / user / password（可简写 pass）/ remote_dir
#   proto（ftp|sftp）/ key_file / key_pass / known_hosts / host_key_check
#   未显式配置 port 时按 proto 补默认（ftp 21 / sftp 22）
# 启用示例：
# [云盘]
# host = 192.168.1.100
# port = 21
# user = myuser
# password = mypass
# remote_dir = /
#
# 匿名服务器示例（省略 user/password）：
# [公共盘]
# host = ftp.example.com
# port = 21
# remote_dir = /public
#
# SFTP 示例（port 省略即 22）：
# [备份盘]
# host = backup.example.com
# proto = sftp
# user = deploy
# key_file = /data/Namespace-Proxy/keys/id_ed25519
# remote_dir = /srv/backup
