[GLOBAL]
# 全局开关（ON 开启 / OFF 关闭，去掉 # 启用）
#GLOBAL_INJECT ON
#MONITOR ON
#SANDBOX ON
#SKIP_SYSTEM_APPS ON

# 规则（去掉 # 启用）：
#REDIRECT <虚拟路径> <真实目标>   重定向
#HIDE <路径>                     隐藏（访问返回不存在）
#ALLOW <路径>                    允许访问
#RO <路径>                       只读
#ALLOW /                        放行所有（等价 SANDBOX OFF）

# 用户变量（规则中可用 $NAME / ${NAME} 引用）
#DATA_BASE=/sdcard/Android/data/$package

# FTP 存储后端：访问 /0/<段名>/... 映射到 ftp.conf 的 [段名] 服务器
#FTP /云盘 云盘

# 常规示例：
#REDIRECT /Download/ /Download/
#HIDE /Download/private
#RO /Download/readonly
