# Fuse-Proxy 规则文件（/data/Namespace-Proxy/injector.conf）
# 完整规范见仓库 docs/config.md；行首 `#` 才算注释，行内 `#` 会并入规则。
# 路径 ≤255 字符、单行 ≤2048 字节；变量定义必须紧凑 `NAME=VALUE`（`=` 两侧无空格）。
# 注意：本文件经 rule_server 前端管理——注释掉的规则行会被当作「已停用规则」
# 展示，请勿把示例规则留在这里；新增规则走前端或直接写启用行。

[GLOBAL]
# 全局注入总开关（ON 开启全局注入；OFF 则只对显式点名的应用段注入）
GLOBAL_INJECT ON
# 是否跳过系统应用（默认 ON；类别判定/注入过滤共用 pm 缓存 sys_pkgs.cache）
SKIP_SYSTEM_APPS ON
