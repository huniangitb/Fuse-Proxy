# Fuse-Proxy 示例规则（/data/Namespace-Proxy/injector.conf）
# 完整规范见仓库 docs/ai-config-guide.md；行首 `#` 才算注释，行内 `#` 会并入规则。
# 路径 ≤255 字符、单行 ≤2048 字节；变量定义必须紧凑 `NAME=VALUE`（`=` 两侧无空格）。

[GLOBAL]
# 全局注入总开关（ON 开启全局注入；OFF 则只对显式点名的应用段注入）
GLOBAL_INJECT ON
# 是否跳过系统应用（默认 ON；类别判定/注入过滤共用 pm 缓存 sys_pkgs.cache）
SKIP_SYSTEM_APPS ON
#MONITOR ON
#SANDBOX ON

# 路径变量（段内 `NAME=VALUE` 定义，规则中用 $NAME / ${NAME} 引用；保留名 package 禁止覆盖）
#DATA_BASE=/sdcard/Android/data/$package
#STATIC_BASE=/sdcard/MyStatic

# 四类规则示例（去掉 `#` 启用；REDIRECT 虚拟前缀侧禁止用 $package，$package 只放 target 侧）：
#REDIRECT /files   $DATA_BASE/files
#HIDE     $DATA_BASE/private
#RO       $DATA_BASE/cache
#ALLOW    /system/fonts
#REDIRECT /sdcard/MyApp   /storage/emulated/0/MyApp
#HIDE /Android/data/com.foo/*
#RO /system/fonts
#ALLOW /                        # 放行所有（等价 SANDBOX OFF），慎用

# FTP 存储映射（去掉 `#` 启用；`云盘` 段需在 ftp.conf 中配置 host/port/user/password/remote_dir）：
#FTP /云盘 云盘

# 单应用段示例：
#[com.tencent.mm] ON
#MONITOR ON
#SANDBOX OFF
#HIDE /sdcard/Tencent/MicroMsg/*/credential
#RO /system/fonts

# 多用户/多开示例（:uid 为活跃用户 ID，规则仅对该用户实例生效）：
#[com.tencent.mm:999] ON
#SANDBOX ON
#HIDE /sdcard/Tencent/MicroMsg/999/private

# 类别段示例（优先级：应用专属 > 类别 > GLOBAL；类别段有实质规则即点名注入）：
# user 0 全部用户应用（裸 [USER_APPS] 则对所有用户生效）：
#[USER_APPS:0] ON
#HIDE $DATA_BASE/private
# 全部系统应用（忽略 uid，带 :uid 会被归一并告警）：
#[SYSTEM_APPS] ON
#RO /system/fonts

# 关闭某应用注入（OFF 后其规则不生效）：
#[com.termux] OFF
