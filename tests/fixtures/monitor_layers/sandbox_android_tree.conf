# 沙盒 /Android 的解析契约：三个容器本身与该应用自己的私有目录仍让位真实路径，
# 其余条目（含他包 media 子树、/Android 下新建的条目）落进本应用沙盒镜像；
# 他包 data|obb 子树照旧让位，交跨应用隔离判据裁决。
# 本夹具另带一行 SANDBOX_ANDROID_TREE：该开关已废弃，行须照常解析、不报错、
# 不改变任何落点（夹具与 sandbox.conf 的断言必须一模一样）。
[GLOBAL]
MONITOR OFF
SANDBOX OFF
SANDBOX_ANDROID_TREE ON

[com.demo.app] ON
SANDBOX ON
