# tests/fixtures/config_snapshot/injector.conf
#
# test_config_snapshot.py 专用 fixture：驱动 config_parser 解析 + config_publisher
# STATIC 快照输出。覆盖：默认值（未写的开关）、[GLOBAL]、[pkg]、[pkg:uid]、
# 类别段 [USER_APPS:0] / [SYSTEM_APPS]、ALLOW 与 REDIRECT 的区分、
# 路径前缀归一（/storage/emulated 与 /sdcard 别名剥离、通配符不剥尾斜杠）与变量赋值。

[GLOBAL]
GLOBAL_INJECT ON
FUSE_EXTRA_ARGS --strip-o-direct

DATA_BASE=/sdcard/AppData

REDIRECT /files /Download
REDIRECT /emudir /storage/emulated/0/Download
REDIRECT /vardir $DATA_BASE/files
ALLOW /system/fonts
HIDE /sdcard/Secret
HIDE /storage/emulated/0/EmuHidden
RO /sdcard/ReadOnly
RO /sdcard/*/cache/

[com.example.app]
MONITOR ON
HIDE /sdcard/AppSecret
REDIRECT /appdir /data/media/0/AppDir

[com.example.app:999]
SANDBOX ON
ALLOW /sdcard/Public

[USER_APPS:0]
HIDE /sdcard/CatSecret

[SYSTEM_APPS]
RO /system/vendor
