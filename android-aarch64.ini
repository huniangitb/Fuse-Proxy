[binaries]
# 工具链经 PATH 解析（Meson 配置时存绝对路径）：必须用 scripts/android-build.sh
# 配置（它先探测 NDK 再配 PATH），勿手动 meson setup，否则找不到 NDK 工具。
c = 'aarch64-linux-android35-clang'
cpp = 'aarch64-linux-android35-clang++'
ar = 'llvm-ar'
ranlib = 'llvm-ranlib'
strip = 'llvm-strip'
pkgconfig = 'pkg-config'
# cmake 子项目（json-c）交叉编译必需：meson 在 cross 下只认此处的 cmake
cmake = 'cmake'

[built-in options]
c_std = 'c23'
cpp_std = 'c++23'

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
